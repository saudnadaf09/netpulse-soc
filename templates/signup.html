<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetPulse v1.0 - Register Analyst</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-gray-900 border border-gray-800 p-8 rounded-2xl shadow-2xl">
        <div class="text-center mb-8">
            <span class="px-3 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 rounded-md text-xs font-mono font-bold tracking-widest uppercase">NetPulse v1.0</span>
            <h1 class="text-2xl font-bold text-white mt-3">Analyst Registration</h1>
            <p class="text-xs text-gray-400 mt-1 font-mono">Create new credentials</p>
        </div>

        <form action="/signup" method="POST" class="space-y-5">
            <div>
                <label class="block text-xs font-mono text-gray-400 uppercase mb-2">Username</label>
                <input type="text" name="username" required class="w-full bg-gray-950 border border-gray-800 rounded-lg p-3 text-sm text-emerald-400 font-mono focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-xs font-mono text-gray-400 uppercase mb-2">Email Address</label>
                <input type="email" name="email" required class="w-full bg-gray-950 border border-gray-800 rounded-lg p-3 text-sm text-emerald-400 font-mono focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-xs font-mono text-gray-400 uppercase mb-2">Password</label>
                <input type="password" name="password" required class="w-full bg-gray-950 border border-gray-800 rounded-lg p-3 text-sm text-emerald-400 font-mono focus:outline-none focus:border-emerald-500">
            </div>
            <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-mono text-sm font-bold rounded-lg transition shadow-lg shadow-emerald-500/20">REGISTER ANALYST</button>
        </form>

        <p class="text-center text-xs text-gray-500 font-mono mt-6">
            Already registered? <a href="/login" class="text-emerald-400 hover:underline">Login here</a>
        </p>
    </div>
</body>
</html>
