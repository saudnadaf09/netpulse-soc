<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetPulse v1.0 - Two-Factor Authentication</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-gray-900 border border-gray-800 p-8 rounded-2xl shadow-2xl text-center">
        <span class="px-3 py-1 bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 rounded-md text-xs font-mono font-bold tracking-widest uppercase">Security Check</span>
        <h1 class="text-2xl font-bold text-white mt-4">Two-Factor Authentication</h1>
        <p class="text-xs text-gray-400 mt-2 font-mono">Enter the security code shown above to proceed.</p>

        <!-- Live Display OTP Box -->
        <div class="my-6 p-4 bg-cyan-950/40 border border-cyan-500/40 rounded-xl shadow-inner">
            <span class="text-[11px] font-mono text-gray-400 uppercase tracking-wider block mb-1">Generated Access Code:</span>
            <span class="text-3xl font-mono font-extrabold text-cyan-400 tracking-widest">{{ otp_hint }}</span>
        </div>

        <form action="/verify-2fa" method="POST" class="space-y-6">
            <div>
                <input type="text" name="otp" maxlength="6" placeholder="------" required class="w-full bg-gray-950 border border-gray-800 rounded-lg p-4 text-center text-2xl tracking-widest text-cyan-400 font-mono focus:outline-none focus:border-cyan-500">
            </div>
            <button type="submit" class="w-full py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-mono text-sm font-bold rounded-lg transition shadow-lg shadow-cyan-500/20">VERIFY CODE</button>
        </form>
    </div>
</body>
</html>
