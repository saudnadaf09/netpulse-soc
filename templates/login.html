<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetPulse v1.0 - Secure Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-gray-900 border border-gray-800 p-8 rounded-2xl shadow-2xl">
        <div class="text-center mb-8">
            <span class="px-3 py-1 bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 rounded-md text-xs font-mono font-bold tracking-widest uppercase">NetPulse v1.0</span>
            <h1 class="text-2xl font-bold text-white mt-3">Security Operations Center</h1>
            <p class="text-xs text-gray-400 mt-1 font-mono">Authenticate to access live packet stream</p>
        </div>

        <form action="/login" method="POST" class="space-y-6">
            <div>
                <label class="block text-xs font-mono text-gray-400 uppercase mb-2">Username</label>
                <input type="text" name="username" required class="w-full bg-gray-950 border border-gray-800 rounded-lg p-3 text-sm text-cyan-400 font-mono focus:outline-none focus:border-cyan-500">
            </div>
            <div>
                <label class="block text-xs font-mono text-gray-400 uppercase mb-2">Password</label>
                <input type="password" name="password" required class="w-full bg-gray-950 border border-gray-800 rounded-lg p-3 text-sm text-cyan-400 font-mono focus:outline-none focus:border-cyan-500">
            </div>
            <button type="submit" class="w-full py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-mono text-sm font-bold rounded-lg transition shadow-lg shadow-cyan-500/20">ACCESS TERMINAL</button>
        </form>

        <p class="text-center text-xs text-gray-500 font-mono mt-6">
            Don't have an account? <a href="/signup" class="text-cyan-400 hover:underline">Sign up</a>
        </p>
    </div>
</body>
</html>
